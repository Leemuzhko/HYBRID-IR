name: Reviewed transfer check
"on":
  push:
    branches: [release/hir3a-0.4.1]
    paths: [.github/workflows/transfer-probe.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check short-lived reviewed baseline transfer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          b=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/blobs/43a11d5c19fc1497d7907cb9024bcefc1fd258b4']))
          u=json.loads(base64.b64decode(b['content']))['download_url']
          print('::add-mask::'+u,flush=True)
          try:
              with urllib.request.urlopen(u,timeout=60) as response:data=response.read(2000000)
          except urllib.error.HTTPError as e:
              raise RuntimeError('Transfer HTTP status '+str(e.code)) from None
          except Exception as e:
              raise RuntimeError('Transfer failed: '+type(e).__name__) from None
          assert hashlib.sha256(data).hexdigest()=='9b4343c61254a962582139a547666d7c31d9f72bac140857426169094813bb1f'
          print('Reviewed baseline transfer: PASS; no repository files changed')
          PY
