name: Promote tested macOS 13 compatibility release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-macos13.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download and verify unchanged compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/macos-compat12-0.4.1-preview.1"
          for f in             HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip             HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip.sha256             HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip             HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip.sha256
          do
            curl --fail --location --retry 3 --output "$f" "$base/$f"
          done
          echo "a698743a7c69295c6ceb91f88fd5de5864a31e9e7aa500330bde8660ba14be20  HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip" | sha256sum -c -
          echo "8f883a4eebde62cccd758f0b09c7c90ef3515cece16da833708601cff96c58a9  HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip" | sha256sum -c -

      - name: Add compatibility archives to v0.4.1
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.4.1             HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip             HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip.sha256             HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip             HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip.sha256             --repo "$REPO" --clobber

      - name: Update bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/398745717" > stable.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("stable.json").read_text())
          body = d["body"]

          body = body.replace(
              "# HYBRID IR 0.4.1 — Windows + macOS preview",
              "# HYBRID IR 0.4.1 — Windows + macOS",
          )
          body = body.replace(
              "This release contains the original Windows 0.4.1 packages and separately added native macOS previews.",
              "This release contains the original Windows 0.4.1 packages and native macOS builds. The compatibility packages below have now been tested successfully on macOS 13; macOS 12.3+ remains a compatibility target pending a separate real-system test.",
          )
          en_row = "| macOS 15+ — Intel | [x86_64 application — preview](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-x86_64-preview.zip) |"
          en_extra = en_row + """\n| macOS 13 — Apple Silicon | [ARM64 compatibility build](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip) |\n| macOS 13 — Intel | [x86_64 compatibility build](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip) |"""
          if "macOS-arm64-compat12-preview.zip" not in body:
              body = body.replace(en_row, en_extra)

          body = body.replace(
              "### Mac preview: validation and limitations",
              "### macOS validation and compatibility",
          )
          old_en = "The attached application ZIPs are the unchanged builds tested on native Apple Silicon and Intel **macOS 15.7.9**. Tests covered native startup, GUI, data round trips, K-weighted modes, saved defaults, FIR training and HIR3A export. The maintainer additionally confirmed startup of a preview build, not manual testing of both architectures. Audible playback, prolonged hands-on use and physical pedal installation are separate checks."
          new_en = "The original macOS packages were validated on native Apple Silicon and Intel **macOS 15.7.9**. The separate compatibility candidate has now also been **successfully tested by the maintainer on macOS 13**. Its binaries declare a minimum of macOS 12.3; **12.3+ remains a compatibility target and is not yet confirmed by a separate real-system test**. Existing automated checks cover startup, GUI, data round trips, K-weighted modes, saved defaults, FIR training and HIR3A export. Audible playback, prolonged hands-on use and physical pedal installation remain separate checks."
          body = body.replace(old_en, new_en)

          body = body.replace(
              "Подготовка кабинетных IR, гибридная FIR/IIR-аппроксимация и создание переключаемых банков Zoom ZDL. В релизе находятся первоначальные Windows-пакеты 0.4.1 и отдельно добавленные нативные предварительные сборки macOS.",
              "Подготовка кабинетных IR, гибридная FIR/IIR-аппроксимация и создание переключаемых банков Zoom ZDL. В релизе находятся первоначальные Windows-пакеты 0.4.1 и нативные сборки macOS. Compatibility-пакеты ниже теперь успешно проверены на macOS 13; macOS 12.3+ остаётся целевой совместимостью до отдельной проверки на реальной системе.",
          )
          ru_row = "| macOS 15+ — Intel | [Приложение x86_64 — preview](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-x86_64-preview.zip) |"
          ru_extra = ru_row + """\n| macOS 13 — Apple Silicon | [ARM64 compatibility build](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip) |\n| macOS 13 — Intel | [x86_64 compatibility build](https://github.com/Leemuzhko/HYBRID-IR/releases/download/v0.4.1/HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip) |"""
          if body.count("macOS-arm64-compat12-preview.zip") < 2:
              body = body.replace(ru_row, ru_extra)

          body = body.replace(
              "### Mac preview: проверки и ограничения",
              "### Проверки и совместимость macOS",
          )
          old_ru = "Приложены неизменённые ZIP, проверенные на нативных Apple Silicon и Intel с **macOS 15.7.9**. Автотесты охватывали запуск, интерфейс, сохранение/чтение данных, K-weighted, defaults, FIR-обучение и экспорт HIR3A. Автор дополнительно подтвердил запуск одной preview-сборки, а не ручную проверку обеих архитектур. Прослушивание, длительная работа и установка в физическую педаль требуют отдельных проверок."
          new_ru = "Исходные macOS-пакеты проверены на нативных Apple Silicon и Intel с **macOS 15.7.9**. Отдельный compatibility candidate теперь также **успешно проверен автором на macOS 13**. Его бинарники заявляют минимум macOS 12.3; **12.3+ пока остаётся целевой совместимостью и не подтверждена отдельным тестом на реальной системе**. Автотесты охватывают запуск, интерфейс, сохранение/чтение данных, K-weighted, defaults, FIR-обучение и экспорт HIR3A. Прослушивание, длительная работа и установка в физическую педаль остаются отдельными проверками."
          body = body.replace(old_ru, new_ru)

          Path("stable-body.md").write_text(body)
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "name": "HYBRID IR 0.4.1 — Windows + macOS",
              "body": Path("stable-body.md").read_text(),
              "prerelease": False,
              "make_latest": "true",
          }
          Path("stable-patch.json").write_text(json.dumps(payload))
          PY
          gh api --method PATCH "repos/$REPO/releases/398745717" --input stable-patch.json

      - name: Promote compatibility pre-release to release
        shell: bash
        run: |
          set -euo pipefail
          cat > compat-body.md <<'EOF'
          # HYBRID IR 0.4.1 — macOS 13 / 12.3+ compatibility

          [English](#english) · [Русский](#russian)

          <a id="english"></a>
          ## English

          This compatibility build has now been **successfully tested on macOS 13** and is promoted from pre-release to a regular release.

          - Apple Silicon (ARM64) and Intel (x86_64) packages are provided.
          - The packaged binaries declare **macOS 12.3** as their minimum.
          - **macOS 12.3+ has not yet received a separate real-system confirmation**, so 12.3 remains a compatibility target rather than a verified platform.
          - The application ZIPs are unchanged from the tested candidate; SHA-256 files and validation reports remain attached.
          - The app is ad-hoc signed, not Developer ID signed or Apple-notarized.

          These compatibility ZIPs are also attached to the main **v0.4.1** release for easier discovery.

          <a id="russian"></a>
          ## Русский

          Эта compatibility-сборка теперь **успешно проверена на macOS 13** и переведена из pre-release в обычный release.

          - Доступны пакеты Apple Silicon (ARM64) и Intel (x86_64).
          - Минимальная версия, заявленная бинарниками — **macOS 12.3**.
          - **Отдельной проверки на реальной macOS 12.3+ пока не было**, поэтому 12.3 остаётся целевой совместимостью, а не подтверждённой платформой.
          - ZIP приложений не изменены относительно проверенного candidate; SHA-256 и отчёты validation сохранены.
          - Подпись приложения ad-hoc, без Developer ID и нотарификации Apple.

          Эти же compatibility ZIP добавлены в основной релиз **v0.4.1**, чтобы их было проще найти.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "name": "HYBRID IR 0.4.1 — macOS 13 / 12.3+ compatibility",
              "body": Path("compat-body.md").read_text(),
              "prerelease": False,
              "make_latest": "false",
          }
          Path("compat-patch.json").write_text(json.dumps(payload))
          PY
          gh api --method PATCH "repos/$REPO/releases/400865672" --input compat-patch.json

      - name: Verify final release state and assets
        shell: bash
        run: |
          set -euo pipefail
          stable="$(gh api "repos/$REPO/releases/398745717")"
          compat="$(gh api "repos/$REPO/releases/400865672")"
          python3 - "$stable" "$compat" <<'PY'
          import json, sys
          stable, compat = map(json.loads, sys.argv[1:3])
          names = {a["name"] for a in stable["assets"]}
          required = {
              "HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip",
              "HYBRID-IR-0.4.1-macOS-arm64-compat12-preview.zip.sha256",
              "HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip",
              "HYBRID-IR-0.4.1-macOS-x86_64-compat12-preview.zip.sha256",
          }
          missing = required - names
          if missing:
              raise SystemExit("Missing stable release assets: " + ", ".join(sorted(missing)))
          if stable["prerelease"] or compat["prerelease"]:
              raise SystemExit("A release is still marked prerelease")
          print("stable assets:", len(names))
          print("compat assets:", len(compat["assets"]))
          print("release promotion verified")
          PY
