name: Register reviewed HYBRID IR source
"on":
  push:
    branches: [release/hir3a-0.4.1]
    paths: [.github/workflows/import-reviewed-release.yml]
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 382fd26917bd64a7d52d6ac21da008d035bcbf02
          persist-credentials: false
      - name: Verify and register only application Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,concurrent.futures,hashlib,json,lzma,os,subprocess,urllib.request,zlib
          from pathlib import Path,PurePosixPath
          BASE='382fd26917bd64a7d52d6ac21da008d035bcbf02'
          PARTS=['cd932c7921186504a26bc10692e945d3bd42c9d3','5afb37e52338b25be8bd45dc8e5e7db4aed41b38','bda4e72351dd2c48d70cfa842114a91c2eeaf100','065dec0415bf0470c0619c687313d83ebeba92ba','436ccd9ece5386e8a4de9d0f266a007a26c7632f','5f8b73358bf4848e415e355705ccf6133e824934','0477a5859592a9c005acf018e06a695900feb175','151cff5d6c60293888bffb45d6bef662cd5f2091']
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='Leemuzhko/HYBRID-IR'
          def api(path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'HYBRID-IR-reviewed-source'})
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          def digest(b):return hashlib.sha256(b).hexdigest()
          def object_id(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def unique(pairs):
              result={}
              for k,v in pairs:assert k not in result;result[k]=v
              return result
          packed=b''.join(base64.b64decode(api('git/blobs/'+oid)['content']) for oid in PARTS)
          assert len(packed)==68288 and digest(packed)=='a83a60682e7baf03afed02b64d9b3f8609a55430e758d3303c707038c755edae'
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw=decoder.decompress(packed,max_length=5000000);assert decoder.eof and not decoder.unused_data
          transfer=json.loads(raw,object_pairs_hook=unique)
          assert transfer['base_commit']==BASE and len(transfer['files'])==138
          payload={};cache={};folded=set()
          def validate(name):
              p=PurePosixPath(name)
              assert name and str(p)==name and not p.is_absolute() and '\\' not in name
              assert all(x not in ('..','.git') for x in p.parts) and all(ord(c)>=32 for c in name)
          for name,row in transfer['files'].items():
              validate(name);assert name.casefold() not in folded;folded.add(name.casefold());old=b''
              if row.get('base'):
                  key=row['base'];validate(key)
                  if key not in cache:cache[key]=subprocess.check_output(['git','show',BASE+':'+key])
                  old=cache[key]
                  if row.get('base_sha256'):assert digest(old)==row['base_sha256']
              if 'ops' in row:
                  lines=old.decode('utf-8').replace('\r\n','\n').splitlines(keepends=True);pieces=[]
                  for op in row['ops']:
                      if isinstance(op,list):
                          a,b=op;assert 0<=a<=b<=len(lines);pieces.append(''.join(lines[a:b]))
                      else:assert isinstance(op,str);pieces.append(op)
                  text=''.join(pieces);out=(text.replace('\n','\r\n') if row['crlf'] else text).encode('utf-8')
              elif 'compressed' in row:
                  d=zlib.decompressobj(zdict=old[-32768:]) if row.get('base') else zlib.decompressobj()
                  out=d.decompress(base64.b64decode(row['compressed']),5000000)
                  assert d.eof and not d.unused_data and not d.unconsumed_tail;out+=d.flush()
              else:out=old
              assert digest(out)==row['sha256'],name;payload[name]=out
          manifest=payload['PUBLICATION_MANIFEST.json']
          assert digest(manifest)=='7f7c872016bb0025537ad8996191e63adc221d15502815cf130c92d79240a4ae'
          m=json.loads(manifest,object_pairs_hook=unique)
          assert m['source_revision']=='2411a5f03864ccaab458df25ddeab98744145532' and m['app_version']=='0.4.1'
          expected={f['path']:f['sha256'] for f in m['files']}
          assert len(expected)==len(m['files']) and set(payload)==set(expected)|{'PUBLICATION_MANIFEST.json'}
          for name,value in expected.items():assert digest(payload[name])==value
          assert digest(payload['hybridir_sdk/templates/HIR3A.ZDL'])=='14f605e66ea0ca24a1bd0b0873cb15b8dbaf900290ffe78f9f6cb60c99b0f9d4'
          old_objects=set(subprocess.check_output(['git','ls-tree','-r',BASE],text=True).split())
          workflows={};entries=[]
          def register(item):
              name,data=item;oid=object_id(data)
              if oid not in old_objects:
                  assert api('git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']==oid
              return {'path':name,'mode':'100644','type':'blob','sha':oid}
          application=[]
          for name,data in payload.items():
              if name.startswith('.github/workflows/'):workflows[name]={'sha':object_id(data),'sha256':digest(data)}
              else:application.append((name,data))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:entries=list(pool.map(register,application))
          tree=api('git/trees',{'tree':sorted(entries,key=lambda e:e['path'])})
          result={'application_tree':tree['sha'],'application_files':len(entries),'workflow_files_for_authorized_connector':workflows,'manifest_sha256':digest(manifest),'source_revision':m['source_revision']}
          Path('REGISTERED_SOURCE.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          print('No branches, tags, releases or workflow files modified by this job.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-source-object-receipt
          path: REGISTERED_SOURCE.json
          if-no-files-found: error
          retention-days: 7
