name: Windows application packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 0.4.1-rc1"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'
          architecture: x64
      - run: python -m pip install --only-binary=:all: -r requirements-zoom-lock.txt
      - name: Lifecycle tests
        working-directory: irbq_lab
        run: python -B -m unittest tests.test_installation tests.test_update tests.test_uninstall tests.test_distribution
      - name: Build both flavors
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: pwsh
        run: |
          $channel = if ($env:REPOSITORY_NAME -eq 'HYBRID-IR_development') { 'development' } else { 'stable' }
          python -B scripts/build_hybrid_distribution.py --out artifacts --version "$env:PACKAGE_VERSION" --channel $channel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real disposable lifecycle smoke
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Directory | ForEach-Object {
            python -B scripts/smoke_hybrid_distribution.py --source $_.FullName --work ("smoke-" + $_.Name)
            if ($LASTEXITCODE -ne 0) { throw "Lifecycle smoke failed" }
            if ($_.Name -like '*Standalone') {
              python -B scripts/smoke_standalone_uninstall.py --source $_.FullName --work ("uninstall-" + $_.Name)
              if ($LASTEXITCODE -ne 0) { throw "Uninstall entrypoint smoke failed" }
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-packages
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
